
name: Deploy S3 Static Website

on:
  push:
    branches:
      - s3-template
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922176437588:role/GithubActions 
          aws-region: eu-north-1

      - name: Upload website
        run: |
          aws s3 cp index.html s3://cf-s3-websitebucket-ofpyr9fnef3f/index.html \
            --content-type text/html
